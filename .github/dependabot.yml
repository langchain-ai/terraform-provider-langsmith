version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # Keep the terraform-plugin-* deps bumped together.
      terraform-plugin:
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"

  # GitHub Actions (keeps our pinned action SHAs current)
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
