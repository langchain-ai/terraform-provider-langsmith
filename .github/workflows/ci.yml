name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # Live acceptance tests require LANGSMITH_PROVIDER_ACC=1 and the offline
      # Terraform lifecycle test requires TF_ACC=1, so this runs unit tests only.
      - name: Test
        run: go test ./...

      - name: Set up Terraform for offline acceptance tests
        if: matrix.os == 'ubuntu-latest'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.11.2
          terraform_wrapper: false

      - name: Test full Terraform acceptance suite
        if: matrix.os == 'ubuntu-latest'
        run: make testacc

      - name: Build
        run: go build ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run lint
        run: golangci-lint run

  generate:
    name: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Generate docs
        run: make generate

      - name: Check docs are up to date
        run: |
          git diff --compact-summary --exit-code || \
            (echo "::error::docs/ is stale — run 'make generate' and commit the result." && exit 1)
