name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write          # GoReleaser creates the GitHub Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # GPG signing material from the CI secrets 1Password vault.
      - name: Load GPG signing material from 1Password
        id: op
        uses: 1password/load-secrets-action@2ebe1bc766ed99dcfc292ae0308a9492144563c8 # v2
        with:
          export-env: false
        env:
          OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN_CI }}
          GPG_PRIVATE_KEY: op://CI secrets/terraform-provider-gpg/private_key
          GPG_PASSPHRASE: op://CI secrets/terraform-provider-gpg/passphrase

      # Stored passphrase carries a trailing newline (secrets tooling appends one); strip it.
      - name: Normalize passphrase
        id: pass
        env:
          RAW: ${{ steps.op.outputs.GPG_PASSPHRASE }}
        run: |
          trimmed="$(printf '%s' "$RAW" | tr -d '\n')"
          echo "::add-mask::$trimmed"
          printf 'value=%s\n' "$trimmed" >> "$GITHUB_OUTPUT"

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ steps.op.outputs.GPG_PRIVATE_KEY }}
          passphrase: ${{ steps.pass.outputs.value }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
