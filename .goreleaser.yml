# Release config for the langsmith Terraform provider
# (registry.terraform.io/langchain-ai/langsmith).
#
# This repo is the source of truth for the provider; non-.github content is
# vendored into langchainplus/sdks/terraform via Copybara (vendor_terraform).
# The release workflow (.github/workflows/release.yml) sets GPG_FINGERPRINT after
# importing the signing key, and GoReleaser detached-signs the checksums.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - '386'
      - amd64
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  # goreleaser v2.4+: `formats` (list). On older v2 use `format: zip`.
  - formats:
      - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
  # Checksum the registry manifest too — the Terraform Registry requires a SHA256SUMS
  # entry for terraform-provider-langsmith_<version>_manifest.json (it's also a
  # release asset via the `release.extra_files` block below).
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

# Detached-sign the SHA256SUMS with the registry signing key. GPG_FINGERPRINT is
# exported by crazy-max/ghaction-import-gpg in the release workflow.
signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  disable: true
